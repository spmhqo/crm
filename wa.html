<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WhatsApp Channel Post Strategist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #064e3b; 
      --bg-gradient-end: #020617;
      --card-bg: rgba(16, 185, 129, 0.05);
      --card-border: rgba(16, 185, 129, 0.2);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-heading: #ffffff;
      --accent-primary: #10b981; 
      --accent-hover: #34d399;
      --accent-success: #059669;
      --code-bg: rgba(0, 0, 0, 0.4);
      --shadow-color: rgba(0, 0, 0, 0.5);
      --input-bg: rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      flex-grow: 1;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text-heading);
      letter-spacing: -1px;
      text-transform: uppercase;
    }

    .sub-header {
      font-size: 1.2rem;
      color: var(--accent-primary);
      margin-top: -10px;
      font-weight: 600;
    }

    /* Navigation for Inputs */
    .input-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 25px;
    }

    .nav-btn {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .nav-btn.active {
      background: var(--accent-primary);
      color: white;
      border-color: var(--accent-primary);
    }

    .nav-btn:hover:not(.active) {
      border-color: var(--accent-primary);
      color: var(--text-primary);
    }

    /* Input Section Styles */
    .input-section {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 40px;
      box-shadow: 0 10px 40px var(--shadow-color);
      backdrop-filter: blur(12px);
    }

    .field-group {
      display: none;
      flex-direction: column;
    }

    .field-group.active {
      display: flex;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--accent-primary);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    textarea {
      width: 100%;
      padding: 16px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      transition: all 0.2s;
      min-height: 200px;
      resize: vertical;
      line-height: 1.5;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent-primary);
      background: rgba(0, 0, 0, 0.4);
    }

    /* Prompt Card Styles */
    .prompt-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 0 10px 40px var(--shadow-color);
      backdrop-filter: blur(12px);
      padding: 35px;
      display: flex;
      flex-direction: column;
    }

    .prompt-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-primary);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .prompt-label::after {
      content: "";
      height: 1px;
      flex-grow: 1;
      background: var(--card-border);
    }

    .prompt-text {
      background-color: var(--code-bg);
      padding: 24px;
      border-radius: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.95rem;
      color: #ecfdf5;
      line-height: 1.6;
      margin-bottom: 30px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      max-height: 600px;
      overflow-y: auto;
    }

    .copy-button {
      align-self: flex-end;
      padding: 14px 28px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #ffffff;
      background-color: var(--accent-primary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
    }

    .copy-button:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
    }

    .copy-button.copied {
      background-color: var(--accent-success);
    }

    .icon { width: 18px; height: 18px; }
    .copied-icon { display: none; }
    .copy-button.copied .copy-icon { display: none; }
    .copy-button.copied .copied-icon { display: inline-block; }

    footer {
        margin-top: 60px;
        text-align: center;
        color: var(--text-secondary);
        font-size: 0.85rem;
        padding-bottom: 40px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Channel Post</h1>
      <div class="sub-header">for WhatsApp</div>
    </header>

    <div class="input-nav" id="tabNav">
      <button class="nav-btn active" onclick="switchTab('group1', this)">Package Details</button>
      <button class="nav-btn" onclick="switchTab('group2', this)">PDF Title</button>
      <button class="nav-btn" onclick="switchTab('group3', this)">PDF Sub-Title</button>
      <button class="nav-btn" onclick="switchTab('group4', this)">PDF Body</button>
      <button class="nav-btn" onclick="switchTab('group5', this)">Gateway Problem</button>
      <button class="nav-btn" onclick="switchTab('group6', this)">PDF CTA</button>
      <button class="nav-btn" onclick="switchTab('group7', this)">Platform</button>
    </div>

    <div class="input-section">
      <div id="group1" class="field-group active">
        <label>Package Details</label>
        <textarea id="field1" placeholder="[Insert package details here]"></textarea>
      </div>
      <div id="group2" class="field-group">
        <label>PDF Title</label>
        <textarea id="field2" placeholder="[Insert title]"></textarea>
      </div>
      <div id="group3" class="field-group">
        <label>PDF Sub-Title</label>
        <textarea id="field3" placeholder="[Insert sub-title]"></textarea>
      </div>
      <div id="group4" class="field-group">
        <label>PDF Body</label>
        <textarea id="field4" placeholder="[Insert the complete body of the free report]"></textarea>
      </div>
      <div id="group5" class="field-group">
        <label>Gateway Problem</label>
        <textarea id="field5" placeholder="[Insert gateway problem]"></textarea>
      </div>
      <div id="group6" class="field-group">
        <label>PDF CTA</label>
        <textarea id="field6" placeholder="[Insert the end CTA of the free report here]"></textarea>
      </div>
      <div id="group7" class="field-group">
        <label>Platform Name</label>
        <textarea id="field7" placeholder="[Insert Platform Name: X / Facebook Page / LinkedIn / etc.]"></textarea>
      </div>
    </div>

    <main>
      <div class="prompt-card">
        <div class="prompt-label">Strategy Prompt Preview</div>
        <pre id="displayPrompt" class="prompt-text">Loading template...</pre>
        <button class="copy-button" id="copyBtn">
          <svg class="icon copy-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75" /></svg>
          <svg class="icon copied-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path d="M4.5 12.75l6 6 9-13.5" /></svg>
          <span class="button-text">Copy Prompt</span>
        </button>
      </div>
    </main>

    <footer>
        Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.
    </footer>
  </div>

  <script>
    // Tab Navigation Logic
    function switchTab(groupId, btn) {
      document.querySelectorAll('.field-group').forEach(group => group.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(groupId).classList.add('active');
      btn.classList.add('active');
    }

    const template = `Answer the following prompt in Bengali (India).

Rules:
- Use only Bengali (India).
- Always address the reader as "আপনি".
- Never use "তুমি" or "তুই".
- Use a natural Kolkata-style conversational tone.
- Use natural, modern Bengali (India).
- Avoid Bangladeshi vocabulary, spelling, and expressions.

PROMPT

ROLE

You are a strategic content ideation and conversion-focused WhatsApp Channel content strategist.

Your job is to identify WhatsApp Channel post ideas that can quickly capture attention, communicate one clear message, create interest or recognition, and naturally encourage relevant readers to take the next step toward the free report.

The post must provide genuine value while being concise and suitable for the direct, feed-based nature of a WhatsApp Channel.

CONTEXT

The ultimate package I want to sell through the free report:

[Insert package details here]

Details of the free report:

Title:
[Insert title]

Sub-title:
[Insert sub-title]

Body:
[Insert the complete body of the free report]

The gateway problem addressed by the free report:

[Insert gateway problem]

Prompts I used to identify the gateway problem and assess its lead-magnet potential:

1. Look at this product and identify 10 smaller problems a potential customer might experience immediately before they need it. Focus on problems that could be solved or partly solved with a short free report.

2. Which of these would my ideal customer actually WANT enough to give me their email address?

End CTA of the free report:

[Insert the end CTA of the free report here]

The content funnel is:

WhatsApp Channel Post
↓
Attention
↓
One Clear Message
↓
Recognition / Interest
↓
Gateway Problem
↓
Natural Need for Next Step
↓
Free Report Download
↓
Free Report provides the actionable process / next-step solution
↓
Ultimate Package

The ultimate objective:

To generate relevant interest in and downloads of the free report.

Do not optimise merely for views, reactions, forwards, or curiosity. Prioritise relevant attention and genuine reader need.

WhatsApp Channel-specific content policy:

The post should be concise, immediately understandable, mobile-friendly, and easy to consume in a feed.

It should communicate one clear idea and may use a short observation, insight, question, example, or practical takeaway.

The post may encourage a reaction, reply, forward/share, link click, or free-report download where appropriate.

TASK

Give me 5 WhatsApp Channel post ideas with the strongest potential to generate relevant interest in and downloads of the free report.

For each idea, identify:

1. Post Idea / Hook
2. Reader Problem / Tension
3. Core Message
4. What the Post Will Deliver
5. Connection to the Gateway Problem
6. Why the Free Report Becomes a Natural Next Step
7. Suggested CTA Direction
8. Conversion Logic

Conversion Logic:

Hook
→ Core Message
→ Interest / Recognition
→ Gateway Problem
→ Natural Need for Next Step
→ CTA
→ Free Report
→ Ultimate Package

IMPORTANT REQUIREMENTS

* Make the idea suitable for WhatsApp Channel consumption.
* Keep one dominant idea per post.
* Prioritise immediate clarity and mobile readability.
* Do not turn the post into a long article.
* Do not reproduce the complete actionable process contained in the free report.
* The post should be complete within the scope of its single core idea.
* Do not deliberately make the post incomplete merely to create dependence on the free report.
* Do not use clickbait, exaggerated promises, artificial urgency, or manipulative persuasion.
* The connection to the free report must be natural.
* Do not force a CTA when another reader action is more appropriate.
* The 5 ideas must be genuinely different.
* Do not rank or score the ideas.
* Do not write the full posts. Develop the ideas only.

OUTPUT FORMAT

First, briefly state the core content-to-conversion opportunity.

Then provide the 5 ideas in a table:

| # | Post Idea / Hook | Reader Problem / Tension | Core Message | What the Post Will Deliver | Why the Free Report Becomes the Natural Next Step | Suggested CTA |

Then briefly explain the conversion logic for each idea.`;

    const inputs = {
      'field1': "[Insert package details here]",
      'field2': "[Insert title]",
      'field3': "[Insert sub-title]",
      'field4': "[Insert the complete body of the free report]",
      'field5': "[Insert gateway problem]",
      'field6': "[Insert the end CTA of the free report here]",
      'field7': "[Insert Platform Name: X / Facebook Page / LinkedIn / etc.]"
    };

    const displayPrompt = document.getElementById('displayPrompt');
    const copyBtn = document.getElementById('copyBtn');

    function updatePrompt() {
      let currentPrompt = template;
      for (const id in inputs) {
        const val = document.getElementById(id).value.trim();
        const placeholder = inputs[id];
        if (val !== "") {
          currentPrompt = currentPrompt.split(placeholder).join(val);
        }
      }
      displayPrompt.textContent = currentPrompt;
    }

    // Attach listeners
    for (const id in inputs) {
      document.getElementById(id).addEventListener('input', updatePrompt);
    }

    // Initial run
    updatePrompt();

    // Copy function
    copyBtn.addEventListener('click', () => {
      const textToCopy = displayPrompt.textContent;
      navigator.clipboard.writeText(textToCopy).then(() => {
        const btnText = copyBtn.querySelector('.button-text');
        copyBtn.classList.add('copied');
        btnText.textContent = 'Copied!';
        
        setTimeout(() => {
          copyBtn.classList.remove('copied');
          btnText.textContent = 'Copy Prompt';
        }, 2000);
      });
    });
  </script>

</body>
</html>
